name: Headless PR Reviewer

on:
  pull_request:
    paths: ["openapi.yaml"]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Postman CLI and Claude Code
        run: |
          npm install -g postman-cli@latest
          npm install -g @anthropic-ai/claude-code

      - name: Log in to Postman
        run: postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"

      - name: Fetch the base branch for the diff
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Run the headless agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT="$(cat agents/headless-pr-agent.md)

          This is PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
          The base branch is origin/${{ github.event.pull_request.base.ref }} — diff against it."

          claude -p "$PROMPT" --dangerously-skip-permissions --allowedTools "Bash"
